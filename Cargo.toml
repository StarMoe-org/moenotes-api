[workspace]
members = ["proto", "client", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
http = "1"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "test-util"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
