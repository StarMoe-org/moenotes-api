# Edit this file, run `moenotes-server check-config`, then restart.
# Find the active path with `moenotes-server config-path` or startup logs.
# Container default: /var/lib/moenotes/config.toml (mount a persistent volume).
# Blank settings keep `serve` health-only. Fill with authorized values.
# Protect populated config with mode 0600 and container UID 65532 ownership.
# Account passwords stay ONLY in /accounts/international/*.json, never in this file.
listen = "0.0.0.0:8080"
api_key = "" # Random ASCII HTTP bearer key, at least 32 chars, no whitespace.
response_mode = "public" # raw is for trusted operators only.
access_log = true
timeout_seconds = 10
minimum_interval_ms = 1000
queue_capacity = 32
cache_ttl_seconds = 15
cache_capacity = 1024

[session]
region = ""
origin = ""
allowed_origins = [] # Include the exact HTTPS origin above.
platform = "android"
client_version = ""
# master_version = "" # Configure both versions together only when required.
# resource_version = ""

# Fetch the current master/resource pair anonymously at startup and periodically.
# The values above are optional fallback values. No password login is performed.
[version_sync]
enabled = true
interval_seconds = 60
# Adopt the next patch client release (1.0.3 -> 1.0.4) once the game refuses this one.
follow_client_updates = false

[accounts]
strategy = "single" # "round_robin" uses all files with independent clients; omit selected.
directory = "/accounts/international"
# selected = "worker.json" # Required when multiple account JSON files exist.
allow_create = true # Only when pre-login reports no role in this region.
sdk_ready = false # Set true after required official SDK consent/checks.

[recovery]
enabled = false # Opt in: recovery may invalidate another device's session.
cooldown_seconds = 300

[login]
state_dir = "/var/lib/moenotes" # Existing persistent writable directory, mode 0700.

[login.context]
device_model = ""
operating_system = ""
device_identifier = ""
# Replace these numeric placeholders with observed channel parameters.
global_channel_id = 0
brand_id = 0
area_id = 0

[login.sdk_http]
base_url = ""
allowed_base_urls = [] # Include the exact HTTPS SDK base URL above.
app_key = ""
country_id = 0 # Replace with the actual SDK country ID.
# one_sdk_version = "" # Omit this key when the SDK header is not supplied.
omit_common = ["adid"] # Explicit null/omission; not equivalent to an empty string.

[login.sdk_http.common]
game_id = ""
server_id = ""
merchant_id = ""
app_ver = ""
sdk_ver = ""
channel_id = ""
platform = ""
platform_type = ""
net = ""
operators = ""
model = ""
pf_ver = ""
udid = ""
dp = ""
lang = ""
sdk_log_type = ""
ad_ext = ""
time_zone = ""
isRoot = ""

# Legacy alternatives remain supported, never combined with the matching inline source:
# top-level api_key_file; login.context_file; login.sdk_http_file.
# See docs/configuration.md for migration and SDK omission semantics.

# Optional independent regional backends, in this same config file.
# The top-level session is already registered; add only other regions.
# Example: [regions.en] credentials_file = "en/game-session.json"
# Then [regions.en.session] with region="en", approved origin/allowed_origins,
# platform and client_version. No authentication settings are inherited.
# Region-specific login/accounts/recovery/version_sync use the same sub-sections.
# Each login.state_dir must be private and different from the other regions.
# See docs/configuration.md#multiple-regions and docs/path-routes.md.

# JP uses credential import only; no [regions.jp.login] or recovery.
# [regions.jp.accounts]
# strategy = "round_robin" # Optional; incompatible with selected below.
# directory = "/accounts/jp"
# selected = "worker.json"
